# JitPack configuration
jdk:
  - openjdk17
before_install:
  - sdk install maven 3.9.9
  - sdk use maven 3.9.9
install:
  # The develop snapshot contains a test that references an API not yet
  # committed (AguiFramedEvent). Tests are not needed to publish artifacts.
  - rm -f agentscope-extensions/agentscope-spring-boot-starters/agentscope-agui-spring-boot-starter/src/test/java/io/agentscope/spring/boot/agui/mvc/AguiMvcControllerTest.java
  # service-dataplane has a test-scope dependency on agentscope-examples/jev, so
  # install it before dropping the examples module from the reactor below.
  # JitPack kills builds after 20 minutes: skip javadoc/sources/jacoco to fit.
  - mvn -B -ntp -T1C -pl agentscope-examples/jev -am install -DskipTests -Dspotless.check.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Djacoco.skip=true -Drevision=$VERSION
  - sed -i '/<module>agentscope-examples<\/module>/d' pom.xml
  - mvn -B -ntp -T1C clean install -DskipTests -Dspotless.check.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Djacoco.skip=true -Drevision=$VERSION
